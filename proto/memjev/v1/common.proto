syntax = "proto3";

package memjev.v1;

import "buf/validate/validate.proto";

enum ConsentMode {
  CONSENT_MODE_UNSPECIFIED = 0;
  CONSENT_MODE_DENY = 1;
  CONSENT_MODE_RECALL_ONLY = 2;
  CONSENT_MODE_LEARN_AND_RECALL = 3;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_READ = 1;
  EVENT_KIND_WRITE = 2;
  EVENT_KIND_SEARCH = 3;
  EVENT_KIND_EXECUTE = 4;
  EVENT_KIND_VERIFY = 5;
  EVENT_KIND_OTHER = 6;
}

enum ToolResultState {
  TOOL_RESULT_STATE_UNSPECIFIED = 0;
  TOOL_RESULT_STATE_SUCCESS = 1;
  TOOL_RESULT_STATE_FAILURE = 2;
  TOOL_RESULT_STATE_UNKNOWN = 3;
}

enum IngestDisposition {
  INGEST_DISPOSITION_UNSPECIFIED = 0;
  INGEST_DISPOSITION_ACCEPTED = 1;
  INGEST_DISPOSITION_DUPLICATE = 2;
}

enum OutcomeState {
  OUTCOME_STATE_UNSPECIFIED = 0;
  OUTCOME_STATE_VERIFIED_SUCCESS = 1;
  OUTCOME_STATE_PROVISIONAL_SUCCESS = 2;
  OUTCOME_STATE_INCONCLUSIVE = 3;
  OUTCOME_STATE_VERIFIED_FAILURE = 4;
}

enum EvidenceClass {
  EVIDENCE_CLASS_UNSPECIFIED = 0;
  EVIDENCE_CLASS_INDEPENDENT_VERIFIER = 1;
  EVIDENCE_CLASS_GOAL_PREDICATE = 2;
  EVIDENCE_CLASS_HARNESS_ASSERTION = 3;
  EVIDENCE_CLASS_TOOL_POSTCONDITION = 4;
  EVIDENCE_CLASS_EXIT_STATUS_OR_SELF_REPORT = 5;
}

enum EvidenceVerdict {
  EVIDENCE_VERDICT_UNSPECIFIED = 0;
  EVIDENCE_VERDICT_SATISFIED = 1;
  EVIDENCE_VERDICT_FAILED = 2;
  EVIDENCE_VERDICT_UNKNOWN = 3;
}

enum OutcomeDisposition {
  OUTCOME_DISPOSITION_UNSPECIFIED = 0;
  OUTCOME_DISPOSITION_ACCEPTED = 1;
  OUTCOME_DISPOSITION_DUPLICATE = 2;
}

enum RiskClass {
  RISK_CLASS_UNSPECIFIED = 0;
  RISK_CLASS_LOW = 1;
  RISK_CLASS_MEDIUM = 2;
  RISK_CLASS_HIGH = 3;
  RISK_CLASS_CRITICAL = 4;
}

enum LatencyClass {
  LATENCY_CLASS_UNSPECIFIED = 0;
  LATENCY_CLASS_INTERACTIVE = 1;
  LATENCY_CLASS_STANDARD = 2;
  LATENCY_CLASS_BATCH = 3;
}

enum RetrievalDisposition {
  RETRIEVAL_DISPOSITION_UNSPECIFIED = 0;
  RETRIEVAL_DISPOSITION_SELECTED = 1;
  RETRIEVAL_DISPOSITION_ABSTAINED = 2;
}

enum CandidateLifecycle {
  CANDIDATE_LIFECYCLE_UNSPECIFIED = 0;
  CANDIDATE_LIFECYCLE_CANDIDATE = 1;
  CANDIDATE_LIFECYCLE_TRIAL = 2;
  CANDIDATE_LIFECYCLE_ACTIVE = 3;
}

message Field {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  string string_value = 2 [(buf.validate.field).string.max_len = 65536];
}
