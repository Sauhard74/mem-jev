name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.23.3'
          cache: true
      - name: Verify generated code, contracts, tests, and static analysis
        run: make verify
      - name: Validate executable alert rules
        run: ./scripts/check-alert-rules.sh
      - name: Check protobuf compatibility
        if: github.event_name == 'pull_request'
        run: go run github.com/bufbuild/buf/cmd/buf@v1.47.2 breaking --against ".git#branch=origin/${{ github.event.pull_request.base.ref }}"
      - name: Run integration, retrieval, and 100 RPS gates
        run: ./scripts/integration.sh
      - name: Run public smoke test
        run: ./scripts/smoke.sh
      - name: Prove clean-stack reproducibility
        run: ./scripts/integration.sh && ./scripts/smoke.sh
      - name: Build release image
        run: docker build --build-arg VERSION=ci --build-arg REVISION=${{ github.sha }} --build-arg BUILT_AT=ci -t memjev-api:${{ github.sha }} .
      - name: Scan release image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: memjev-api:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - name: Generate SBOM
        uses: anchore/sbom-action@f8bdd1d8ac5e901a77a92f111440fdb1b593736b # v0.20.6
        with:
          image: memjev-api:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Tear down local stack
        if: always()
        run: docker compose --env-file .env.local down --volumes --remove-orphans || true
